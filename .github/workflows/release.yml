name: release

on:
  push:
    # Tag pushes run the checks then build and publish a release image to GHCR.
    tags:
      - 'v*'
    # Pushes to any branch except main run the checks and a build-only image
    # check, as a gate before opening a PR.
    branches-ignore:
      - main
  # Pull requests run the same checks; build-only, nothing is published.
  pull_request:

# A branch push and its PR share a group (same head ref), so the older run is
# cancelled instead of running twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -v ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Publish only the exact version tag (e.g. v1.2.3 -> :1.2.3); no :latest.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          # Publish only on tag pushes; branch and PR builds are build-only checks.
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
